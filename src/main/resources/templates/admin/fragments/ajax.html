<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="productsScripts">
<script>
const GQL = '/graphql';
const $ = (s, r=document) => r.querySelector(s);
const $id = (id) => document.getElementById(id);
const val = (id) => ($id(id)?.value || '').trim();
const num = (id) => { const v = val(id); return v===''?null:Number(v); };
function toast(msg){ const t=$id('toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); }

async function gql(query, variables={}){
  const res = await fetch(GQL,{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({query,variables}) });
  const json = await res.json();
  if(json.errors){ alert(json.errors[0]?.message || 'GraphQL error'); throw new Error(JSON.stringify(json.errors)); }
  return json.data;
}

/* --------- render helpers --------- */
function renderProds(rows){
  const tb = $('#tbl tbody'); if(!tb) return;
  tb.innerHTML = (rows||[]).map(p=>`
    <tr data-id="${p.id}" data-title="${p.title??''}" data-qty="${p.quantity??''}"
        data-price="${p.price??''}" data-user="${p.user?.id??''}"
        data-cat="${p.category?.id??''}" data-desc="${p.desc??''}">
      <td>${p.id??''}</td><td>${p.title??''}</td><td>${p.quantity??''}</td>
      <td>${p.price??''}</td><td>${p.user? (p.user.fullname??'') : ''}</td>
      <td>${p.category? (p.category.name??'') : ''}</td>
    </tr>`).join('');
  tb.querySelectorAll('tr').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      $id('p_id').value   = tr.dataset.id || '';
      $id('p_title').value= tr.dataset.title || '';
      $id('p_qty').value  = tr.dataset.qty || '';
      $id('p_price').value= tr.dataset.price || '';
      $id('p_user').value = tr.dataset.user || '';
      $id('p_cat').value  = tr.dataset.cat || '';
      $id('p_desc').value = tr.dataset.desc || '';
      toast('Loaded product #'+tr.dataset.id);
    });
  });
}
function renderCats(rows){
  const tb = $('#tblCat tbody'); if(!tb) return;
  tb.innerHTML = (rows||[]).map(c=>`
    <tr data-id="${c.id}" data-name="${c.name??''}" data-img="${c.images??''}">
      <td>${c.id??''}</td><td>${c.name??''}</td><td>${c.images??''}</td>
    </tr>`).join('');
  tb.querySelectorAll('tr').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      $id('c_id').value = tr.dataset.id || '';
      $id('c_name').value = tr.dataset.name || '';
      $id('c_img').value = tr.dataset.img || '';
      toast('Loaded category #'+tr.dataset.id);
    });
  });
}
function renderUsers(rows){
  const tb = $('#tblUser tbody'); if(!tb) return;
  tb.innerHTML = (rows||[]).map(u=>`
    <tr data-id="${u.id}" data-fullname="${u.fullname??''}" data-email="${u.email??''}" data-phone="${u.phone??''}">
      <td>${u.id??''}</td><td>${u.fullname??''}</td><td>${u.email??''}</td><td>${u.phone??''}</td>
    </tr>`).join('');
  tb.querySelectorAll('tr').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      $id('u_id').value = tr.dataset.id || '';
      $id('u_fullname').value = tr.dataset.fullname || '';
      $id('u_email').value = tr.dataset.email || '';
      $id('u_phone').value = tr.dataset.phone || '';
      $id('u_pass').value = '';
      toast('Loaded user #'+tr.dataset.id);
    });
  });
}

/* --------- QUERIES --------- */
async function loadAllAsc(){
  const q=`{ productsSortedByPriceAsc { id title quantity price desc user{ id fullname } category{ id name } } }`;
  const d = await gql(q); renderProds(d.productsSortedByPriceAsc);
}
async function loadByCategory(){
  const cid = Number($id('categoryId').value||1);
  const q=`query($id:ID!){ productsByCategory(categoryId:$id){ id title price user{ id fullname } category{ id name } } }`;
  const d = await gql(q, {id: cid});
  const body = document.getElementById('byCatBody');
  body.innerHTML = (d.productsByCategory||[]).map(p=>`
    <tr><td>${p.id}</td><td>${p.title}</td><td>${p.price}</td>
        <td>${p.user?.fullname??''}</td><td>${p.category?.name??''}</td></tr>`).join('');
}
async function loadCategories(){
  const q=`{ categories{ id name images } }`;
  const d = await gql(q); renderCats(d.categories);
}
async function loadUsers(){
  const q=`{ users{ id fullname email phone } }`;
  const d = await gql(q); renderUsers(d.users);
}

/* --------- MUTATIONS: PRODUCT --------- */
async function createProduct(){
  const q=`mutation($inTitle:String!,$inQty:Int!,$inDesc:String,$inPrice:Float!,$u:ID,$c:ID){
    createProduct(title:$inTitle, quantity:$inQty, desc:$inDesc, price:$inPrice, userId:$u, categoryId:$c){ id }
  }`;
  await gql(q,{
    inTitle: val('p_title'),
    inQty: Number(val('p_qty')||0),
    inDesc: val('p_desc')||null,
    inPrice: Number(val('p_price')||0),
    u: num('p_user'), c: num('p_cat')
  });
  await loadAllAsc(); toast('Product created');
}
async function updateProduct(){
  const id=num('p_id'); if(id==null) return alert('ID is required');
  const q=`mutation($id:ID!,$t:String,$q:Int,$d:String,$p:Float,$u:ID,$c:ID){
    updateProduct(id:$id, title:$t, quantity:$q, desc:$d, price:$p, userId:$u, categoryId:$c){ id }
  }`;
  await gql(q,{ id, t: val('p_title')||null, q: num('p_qty'), d: val('p_desc')||null,
                p: val('p_price') ? Number(val('p_price')) : null, u: num('p_user'), c: num('p_cat') });
  await loadAllAsc(); toast('Product updated');
}
async function deleteProduct(){
  const id=num('p_id'); if(id==null) return alert('ID is required');
  if(!confirm('Delete product #'+id+'?')) return;
  const q=`mutation($id:ID!){ deleteProduct(id:$id) }`;
  await gql(q,{id}); await loadAllAsc(); toast('Product deleted');
}
function clearProductForm(){ ['p_id','p_title','p_qty','p_price','p_user','p_cat','p_desc'].forEach(k=>{$id(k).value=''}); }

/* --------- MUTATIONS: CATEGORY --------- */
async function createCategory(){
  const q=`mutation($n:String!,$img:String){ createCategory(name:$n, images:$img){ id } }`;
  await gql(q,{ n: val('c_name'), img: val('c_img')||null });
  await loadCategories(); toast('Category created');
}
async function updateCategory(){
  const id=num('c_id'); if(id==null) return alert('ID is required');
  const q=`mutation($id:ID!,$n:String,$img:String){ updateCategory(id:$id, name:$n, images:$img){ id } }`;
  await gql(q,{ id, n: val('c_name')||null, img: val('c_img')||null });
  await loadCategories(); toast('Category updated');
}
async function deleteCategory(){
  const id=num('c_id'); if(id==null) return alert('ID is required');
  if(!confirm('Delete category #'+id+'?')) return;
  const q=`mutation($id:ID!){ deleteCategory(id:$id) }`;
  await gql(q,{id}); await loadCategories(); toast('Category deleted');
}

/* --------- MUTATIONS: USER --------- */
async function createUser(){
  const email = val('u_email'); if(!email) return alert('Email is required');
  const q=`mutation($fn:String!,$em:String!,$pw:String!,$ph:String){
    createUser(fullname:$fn, email:$em, password:$pw, phone:$ph){ id }
  }`;
  await gql(q,{ fn: val('u_fullname'), em: email, pw: val('u_pass')||'', ph: val('u_phone')||null });
  await loadUsers(); toast('User created');
}
async function updateUser(){
  const id=num('u_id'); if(id==null) return alert('ID is required');
  const q=`mutation($id:ID!,$fn:String,$em:String,$pw:String,$ph:String){
    updateUser(id:$id, fullname:$fn, email:$em, password:$pw, phone:$ph){ id }
  }`;
  await gql(q,{ id, fn: val('u_fullname')||null, em: val('u_email')||null, pw: val('u_pass')||null, ph: val('u_phone')||null });
  await loadUsers(); toast('User updated');
}
async function deleteUser(){
  const id=num('u_id'); if(id==null) return alert('ID is required');
  if(!confirm('Delete user #'+id+'?')) return;
  const q=`mutation($id:ID!){ deleteUser(id:$id) }`;
  await gql(q,{id}); await loadUsers(); toast('User deleted');
}

/* --------- boot --------- */
window.addEventListener('DOMContentLoaded', ()=>{
  // query
  $id('btnLoad').addEventListener('click', loadAllAsc);
  $id('btnByCat').addEventListener('click', loadByCategory);
  // product
  $id('btnPCreate').addEventListener('click', createProduct);
  $id('btnPUpdate').addEventListener('click', updateProduct);
  $id('btnPDelete').addEventListener('click', deleteProduct);
  $id('btnPClear').addEventListener('click', clearProductForm);
  // category
  $id('btnCatReload').addEventListener('click', loadCategories);
  $id('btnCCreate').addEventListener('click', createCategory);
  $id('btnCUpdate').addEventListener('click', updateCategory);
  $id('btnCDelete').addEventListener('click', deleteCategory);
  // user
  $id('btnUserReload').addEventListener('click', loadUsers);
  $id('btnUCreate').addEventListener('click', createUser);
  $id('btnUUpdate').addEventListener('click', updateUser);
  $id('btnUDelete').addEventListener('click', deleteUser);

  // initial loads
  loadAllAsc(); loadCategories(); loadUsers();
});
</script>
</body>
</html>
